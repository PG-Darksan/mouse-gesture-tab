<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f6f8; color: #1f2d33; font-family: "Yu Gothic UI", "Segoe UI", Meiryo, sans-serif; }
  header { height: 64px; display: flex; align-items: center; gap: 28px; padding: 0 48px; background: #ffffff; border-bottom: 1px solid #dde5e8; }
  .brand { font-weight: 700; font-size: 20px; color: #24424a; }
  nav span { margin-right: 22px; color: #5a6f76; font-size: 15px; }
  main { display: grid; grid-template-columns: 2fr 1fr; gap: 28px; padding: 32px 48px; }
  article, aside { background: #fff; border: 1px solid #dde5e8; border-radius: 14px; padding: 28px 32px; }
  h1 { margin: 0 0 12px; font-size: 30px; }
  .meta { color: #6b7f86; font-size: 14px; margin-bottom: 18px; }
  .hero { height: 230px; border-radius: 12px; background: linear-gradient(135deg, #cfe9ec, #e9f3e4 60%, #f6eedd); margin-bottom: 20px; }
  p { line-height: 1.85; font-size: 16px; margin: 0 0 14px; color: #34474d; }
  aside h2 { font-size: 17px; margin: 0 0 14px; }
  .item { display: flex; gap: 12px; margin-bottom: 16px; }
  .thumb { flex: none; width: 72px; height: 54px; border-radius: 8px; background: #e2edf0; }
  .item div:last-child { font-size: 14px; line-height: 1.5; color: #3d5258; }
</style>
<script>document.documentElement.lang = new URLSearchParams(location.search).get('lang') || 'ja';</script>
</head>
<body>
<header><span class="brand" data-ja="週末さんぽ帖" data-en="Weekend Walks">週末さんぽ帖</span><nav><span data-ja="特集" data-en="Features">特集</span><span data-ja="地図" data-en="Maps">地図</span><span data-ja="季節" data-en="Seasons">季節</span></nav></header>
<main>
  <article>
    <h1 data-ja="川沿いの遊歩道をゆっくり歩く" data-en="A slow walk along the riverside path">川沿いの遊歩道をゆっくり歩く</h1>
    <div class="meta" data-ja="読了 5 分" data-en="5 min read">読了 5 分</div>
    <div class="hero"></div>
    <p data-ja="朝の光が水面に揺れる時間帯は、 人通りも少なく、 気持ちよく歩けます。 橋を三つ渡った先には小さな公園があり、 ひと休みにちょうどよいベンチが並んでいます。" data-en="In the early morning the light dances on the water and the path is quiet. Past the third bridge there is a small park with benches that are perfect for a short break.">朝の光が水面に揺れる時間帯は、 人通りも少なく、 気持ちよく歩けます。</p>
    <p data-ja="帰り道は一本内側の通りへ入ると、 古い商店や喫茶店が続きます。 地図を片手に、 気になった角を曲がってみてください。" data-en="On the way back, take the street one block inland to find old shops and cafés. Keep a map handy and turn wherever looks interesting.">帰り道は一本内側の通りへ入ると、 古い商店や喫茶店が続きます。</p>
  </article>
  <aside>
    <h2 data-ja="関連する記事" data-en="Related">関連する記事</h2>
    <div class="item"><div class="thumb"></div><div data-ja="坂の上の図書館で過ごす午後" data-en="An afternoon at the hilltop library">坂の上の図書館で過ごす午後</div></div>
    <div class="item"><div class="thumb"></div><div data-ja="市場の朝ごはんを食べ比べ" data-en="Breakfast at the morning market">市場の朝ごはんを食べ比べ</div></div>
    <div class="item"><div class="thumb"></div><div data-ja="雨の日に歩きたい屋根付き商店街" data-en="Covered arcades for rainy days">雨の日に歩きたい屋根付き商店街</div></div>
  </aside>
</main>
<script>
  const lang = document.documentElement.lang;
  for (const el of document.querySelectorAll('[data-ja]')) el.textContent = el.dataset[lang] || el.dataset.ja;
</script>
</body>
</html>
