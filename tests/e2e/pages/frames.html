<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Frames test page</title>
<style>
  html, body { margin: 0; font: 15px system-ui, sans-serif; background: #fafafa; }
  iframe { position: absolute; border: 2px solid #8bb; background: #fff; }
  #same { left: 40px; top: 60px; width: 400px; height: 300px; }
  #cross { left: 520px; top: 60px; width: 400px; height: 300px; }
  #blank { left: 40px; top: 420px; width: 400px; height: 200px; }
</style>
<script>
  window.__menus = [];
  window.__childMenus = [];
  addEventListener('contextmenu', (e) => { window.__menus.push({ x: e.clientX, y: e.clientY }); });
  addEventListener('message', (e) => { if (e.data && e.data.childMenu) window.__childMenus.push(e.data.childMenu); });
</script>
</head>
<body>
<p>親ページ</p>
<iframe id="same" src="frame-child.html?same"></iframe>
<iframe id="cross"></iframe>
<iframe id="blank"></iframe>
<script>
  document.getElementById('cross').src = location.protocol + '//gesture.test:' + location.port + '/frame-child.html?cross';
  const blank = document.getElementById('blank');
  blank.contentDocument.open();
  blank.contentDocument.write('<!doctype html><body style="margin:0;height:100%;background:#eef">about:blank の子フレーム</body>');
  blank.contentDocument.close();
</script>
</body>
</html>
